name: Build Mu-Silicium (gtaxllte)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode (DEBUG or RELEASE)'
        required: true
        default: 'RELEASE'
        type: choice
        options:
          - RELEASE
          - DEBUG

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Device Repo & Clone Mu-Silicium
        run: |
          git clone --depth=1 "${{ github.server_url }}/${{ github.repository }}" device_files
          git clone --recursive https://github.com/Project-Silicium/Mu-Silicium.git mu_silicium
          ls -la device_files mu_silicium

      - name: Integrate Device Files
        run: |
          TARGET_DIR=$(find mu_silicium -maxdepth 4 -type d -iname "*gtaxllte*" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="mu_silicium/Silicon/Samsung/Exynos7870Pkg/Devices/gtaxllte"
            mkdir -p "$TARGET_DIR"
          fi
          cp -r device_files/* "$TARGET_DIR/" || true
          rm -f "$TARGET_DIR/README.md"
          ls -la "$TARGET_DIR"

      - name: Setup Environment & Dependencies
        run: |
          cd mu_silicium
          sudo apt-get update
          if [ -f "./setup_env.sh" ]; then
            chmod +x ./setup_env.sh
            ./setup_env.sh -p apt
          else
            sudo apt-get install -y \
              build-essential \
              uuid-dev \
              iasl \
              git \
              python3 \
              python3-pip \
              gcc-aarch64-linux-gnu \
              nasm \
              bison \
              flex \
              libssl-dev
          fi

      - name: Build UEFI for Tab A 10.1 (gtaxllte)
        run: |
          cd mu_silicium
          MODE="${{ github.event.inputs.build_mode || 'RELEASE' }}"
          if [ -f "./build.sh" ]; then
            chmod +x ./build.sh
            ./build.sh -d gtaxllte -r "$MODE" || ./build.sh -d gtaxllte
          elif [ -f "./build_uefi.py" ]; then
            python3 ./build_uefi.py -d gtaxllte -r "$MODE" || python3 ./build_uefi.py -d gtaxllte
          elif [ -f "./build_uefi.sh" ]; then
            chmod +x ./build_uefi.sh
            ./build_uefi.sh -d gtaxllte -r "$MODE" || ./build_uefi.sh -d gtaxllte
          elif [ -f "./build.py" ]; then
            python3 ./build.py -d gtaxllte -r "$MODE" || python3 ./build.py -d gtaxllte
          else
            echo "Build scripts in mu_silicium:"
            ls -la
            exit 1
          fi

      - name: Upload Built UEFI Image
        uses: actions/upload-artifact@v4
        with:
          name: Mu-Silicium-gtaxllte-${{ github.event.inputs.build_mode || 'RELEASE' }}
          path: |
            mu_silicium/*.img
            mu_silicium/Build/**/*.fd
            mu_silicium/Build/**/*.img
            *.img
            Build/**/*.fd
            Build/**/*.img
          if-no-files-found: error
